name: Validate ORVEX static launcher

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate-links:
    name: Validate canonical production links and repository boundary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Validate launcher contract
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('node:fs');

          const html = fs.readFileSync('index.html', 'utf8');
          const readme = fs.readFileSync('README.md', 'utf8');
          const canonicalOrigin = 'https://www.orvex-aviation.com';
          const canonicalRepo = 'hansmex0929-sudo/ORVEX-Aviation-AI-Enterprise';
          const required = [
            '<link rel="canonical" href="https://www.orvex-aviation.com/" />',
            `${canonicalOrigin}/dashboard?business=part-145`,
            `${canonicalOrigin}/dashboard?business=rotor-blade-repair`,
            `${canonicalOrigin}/dashboard?business=test-engine-repair`,
            `${canonicalOrigin}/dashboard?business=parts-brokering`,
            `${canonicalOrigin}/quant`,
          ];

          const missing = required.filter((value) => !html.includes(value));
          if (missing.length > 0) {
            throw new Error(`Missing canonical launcher targets: ${missing.join(', ')}`);
          }

          const forbiddenLinks = [
            'href="/dashboard',
            'href="/quant"',
          ];
          const invalidLinks = forbiddenLinks.filter((value) => html.includes(value));
          if (invalidLinks.length > 0) {
            throw new Error(`Root-relative application routes are not valid in the static launcher: ${invalidLinks.join(', ')}`);
          }

          const requiredBoundaryText = [
            'static compatibility launcher only',
            canonicalRepo,
            canonicalOrigin,
          ];
          const missingBoundaryText = requiredBoundaryText.filter((value) => !readme.includes(value));
          if (missingBoundaryText.length > 0) {
            throw new Error(`Missing legacy-repository boundary text: ${missingBoundaryText.join(', ')}`);
          }

          const forbiddenProductPaths = [
            'src',
            'app',
            'components',
            'package.json',
            'package-lock.json',
            'pnpm-lock.yaml',
            'next.config.js',
            'next.config.mjs',
          ];
          const unexpected = forbiddenProductPaths.filter((path) => fs.existsSync(path));
          if (unexpected.length > 0) {
            throw new Error(`Product implementation belongs in ${canonicalRepo}, not this static launcher: ${unexpected.join(', ')}`);
          }

          console.log('Static launcher routes only to canonical ORVEX production and preserves the legacy repository boundary.');
          NODE
